name: TrendPoint - 定時訊號監控通知

on:
  schedule:
    # 台股交易時段（週一至五 09:00-13:30 台北 = 01:00-05:30 UTC）每 30 分鐘一次；
    # 收盤與週末不執行，避免無意義的 Actions 配額消耗
    - cron: '*/30 1-5 * * 1-5'
  workflow_dispatch: # 支援手動觸發執行
    inputs:
      mode:
        description: '執行模式：once=單次訊號檢測；test-alert=只送一筆測試訊息驗證推播管道'
        type: choice
        options: [once, test-alert]
        default: once

# spec 015：事後表現紀錄（alert_log/）須 commit 回版本庫——排程環境的
# trendpoint.db 存活於 actions/cache（有逐出機制），紀錄一旦遺失不可再生成。
# 現行預設權限為唯讀，故顯式宣告；範圍僅 contents，不擴及其他。
permissions:
  contents: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v5

      - name: 設定 Python 環境
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 還原 SQLite 資料庫快取
        uses: actions/cache@v5
        with:
          path: trendpoint.db
          key: trendpoint-db-${{ github.run_id }}
          restore-keys: |
            trendpoint-db-

      # 這個快取原本只承載 sent_alerts 去重表，DB 裡沒有任何行情資料。
      # 後果是所有「讀 DB」的監控功能在排程環境永遠取不到資料——spec 014 的
      # 均線通知讀 stock_*_daily，在此靜默略過（只印一行提示），就算把
      # ma_alerts_enabled 打開也一則都不會發。此步驟即為補上該前提。
      #
      # --equity-only 是必要的：TAIFEX 期貨在表空時會回填 1998 年起的全歷史
      # （每請求節流 2 秒），那是分鐘級以上的重量作業，不能放進 30 分鐘排程。
      # 期貨監控的連續表仍須在本機以完整 run_ingestion.py 建立。
      #
      # 失敗不阻斷推播：run() 逐標的捕捉例外，取數失敗只會少灌一檔。
      # 但它在任一標的失敗時會**以非零碼結束**（研究用途必須讓失敗可見，
      # 否則下游會靜默沿用舊表），故此處的 continue-on-error 是必要的——
      # 監控端寧可用略舊的日線發通知，也不該因為一檔抓不到就停掉整輪推播。
      # 即使整步失敗，5 分線訊號仍走現抓路徑，不受影響。
      - name: 預熱日線資料表（供均線通知等讀庫功能使用）
        continue-on-error: true
        run: python run_ingestion.py --equity-only

      - name: 執行實時訊號檢測與推播
        env:
          # 舊版 LINE Notify 已於 2025-03-31 停止服務，改用 LINE Messaging API
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 經 env 傳遞而非直接插值進 run:，避免 workflow_dispatch 輸入落入指令字串
          # （此處雖為 choice 型別、值域受 GitHub 限制，仍照慣例辦理）。
          # schedule 觸發時 inputs.mode 為空，退回 once。
          MODE: ${{ inputs.mode || 'once' }}
        run: |
          if [ "$MODE" = "test-alert" ]; then
            # 只送一筆測試訊息即 return，繞過訊號計算與去重表——
            # 用途是單獨驗證「GitHub secrets 有沒有設對」，這是本機跑不到的環節
            python monitor_signals.py --test-alert
          else
            python monitor_signals.py --once
          fi

      # spec 015：僅在 alert_log/ 確有變更時提交。訊號稀疏，多數輪次為 no-op
      # （upsert 的「零變更即零寫入」保證連 mtime 都不動），故這一步大部分時間
      # 什麼也不做，不會產生雜訊 commit。
      #
      # [skip ci] 是必要的：否則每則告警的 commit 都會觸發 tests.yml，
      # 把 Actions 配額耗在對純資料變更跑測試上。
      #
      # 失敗不阻斷推播（FR-010）：本步驟位於推播之後，且 continue-on-error。
      # 未提交的列留待下輪一併提交——upsert 冪等，重覆提交無害。
      - name: 提交事後表現紀錄
        continue-on-error: true
        run: |
          if [ -z "$(git status --porcelain alert_log/ 2>/dev/null)" ]; then
            echo "alert_log/ 無變更，略過提交。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alert_log/
          git commit -m "chore(alert-log): 事後表現紀錄自動更新 [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "提交失敗，第 $i 次重試..."
            sleep $((i * 5))
          done
          echo "提交仍失敗——本輪紀錄留待下輪一併提交（upsert 冪等）。"
          exit 1
