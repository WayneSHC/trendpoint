name: TrendPoint - 盤中時框可行性評估（yfinance 5 分線，手動觸發）

# 用**免費且已在相依清單內**的 yfinance 回答「盤中系統跑不跑得出統計意義」。
#
# **為什麼現在才做得到**：`data_sources/yfinance_source.py` 原註解宣稱
# 「5 天是 yfinance 對 5m 的上限」——該敘述不正確。Yahoo 對 5m 的回溯上限是
# **60 天**（7 天是 1m 的限制）。`docs/reviews/2026-07-30-...` 第五節據
# 「5m 只有約 270 根」判定盤中系統跑不出統計意義並予封存，而 60 天約 2,160 根
# （40 交易日 × 54），是原估的 8 倍。本工作流程即該封存結論的重新檢驗。
#
# **為什麼需要 runner 而非本機**：開發容器的 agent proxy 對行情來源回 403
# （CONNECT 政策拒絕），但 GitHub runner 可達——`alert_scheduler.yml` 每 30 分鐘
# 實抓 yfinance 已長期證實（同 research_b_segment.yml 的理由）。
#
# **本工作流程唯讀**：不寫 DB、不改組態、不入庫。產出為文字報告，供人工判讀。
#
# ⚠ **快照產生方式已收斂**（spec 016 FR-024）：本工作流程原本另存一份
# `data/*_5m.csv` 並單獨上傳，與 `intraday_accumulate.yml` 的累積鏈形成兩套
# 並行的快照路徑——同一份資料有兩個來源、兩種保留期、兩組指紋，遲早分岔。
# 現改為併入同一套累積機制：本檔只做**單次診斷**（回答「這份資料跑不跑得出
# 統計意義」），跨執行的累積、去重、切分與效力標籤一律走
# `run_intraday_eval.py` 與 `intraday_accumulate.yml`。
#
# 需要可重現的快照時，請取用累積鏈的 artifact（`intraday-accumulated`），
# 而非本工作流程的產出。

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: '標的（空白分隔，例：2330.TW 0050.TW）'
        type: string
        default: '2330.TW'
      period:
        description: '回溯期間（上限 60d——Yahoo 對 5m 的硬限制）'
        type: string
        default: '60d'

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v5

      - name: 設定 Python 環境
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 經 env 傳遞輸入而非插值進指令字串（沿用既有 workflow 的慣例）。
      # 逐標的獨立 tee：一檔失敗不影響其他檔的產出。
      - name: 執行可行性評估
        env:
          TICKERS: ${{ inputs.tickers }}
          PERIOD: ${{ inputs.period }}
        run: |
          mkdir -p artifacts
          rc=0
          for t in $TICKERS; do
            safe=$(echo "$t" | tr '.' '_')
            echo "::group::$t"
            python run_5m_evaluation.py \
              --fetch "$t" --period "$PERIOD" \
              2>&1 | tee "artifacts/eval_${safe}.txt" || rc=1
            echo "::endgroup::"
          done
          exit $rc

      # 快照不在此產生（FR-024）：可重現的資料版本一律來自累積鏈的
      # `intraday-accumulated` artifact。本工作流程只留文字診斷。
      - name: 上傳診斷報告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yfinance-5m-probe-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
