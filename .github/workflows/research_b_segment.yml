name: TrendPoint - B 段實測（手動觸發）

# spec 012 / 013 的驗收切成兩段：A 段離線可完成（合成資料即足，已隨 CI 常態跑），
# B 段需要**真實市場資料**才能回答「這功能到底有沒有用」。本工作流程即 B 段的
# 執行環境——行情來源在 GitHub runner 上可達，`alert_scheduler.yml` 每 30 分鐘
# 實抓 yfinance 已長期證實這一點。
#
# 產出以 artifact 形式保留（報告 + trendpoint.db + CSV 快取），供人工判讀與回填。
# **本工作流程不會改動任何組態**：run_b_segment.py 的覆寫全在記憶體內完成。

on:
  workflow_dispatch:
    inputs:
      scope:
        description: '資料範圍：equity=只灌現貨（快）；full=含期貨 TAIFEX 回填（三商品首次共約 25 分鐘）'
        type: choice
        options: [equity, full]
        default: equity
      ticker:
        description: '只跑指定標的（留空 = 設定檔全部）'
        type: string
        default: ''
      sims:
        description: '蒙地卡羅重抽次數（SC-015 門檻校準用）'
        type: string
        default: '5000'

jobs:
  b-segment:
    runs-on: ubuntu-latest
    # 首次 TAIFEX 回填自 1998 年起、逐月批次、每請求節流 2 秒（約 341 請求 ≈ 11 分鐘），
    # 之後走增量。留足餘裕但遠低於 6 小時上限。
    timeout-minutes: 90

    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v5

      - name: 設定 Python 環境
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 刻意與 alert_scheduler.yml 的 `trendpoint-db-` 分開命名空間：
      # 本流程的 DB 是研究產物（含期貨全歷史），不應與排程監控的輕量 DB 互相覆蓋。
      - name: 還原研究用 SQLite 快取
        uses: actions/cache@v5
        with:
          path: trendpoint.db
          key: trendpoint-research-db-${{ github.run_id }}
          restore-keys: |
            trendpoint-research-db-

      # **刻意不加 continue-on-error**：run_ingestion 在任一標的失敗時以非零碼
      # 結束，本步驟隨之紅掉。這是研究流程該有的行為——匯入失敗的標的不會產出
      # 新資料，但快取還原的舊表仍在，下游回測照樣讀得到，只是那份資料屬於
      # 上一次執行。run 30706957226 即如此：0050.TW 匯入失敗、無 CSV 產出，
      # walk-forward 卻報出與前一次逐項相同的數字，而整個 job 顯示成功。
      #
      # 代價是單一標的的暫時性失敗會中斷整輪研究。這是刻意的取捨：
      # 重跑一次的成本，遠低於把混了舊資料的數字寫進規格。
      - name: 匯入市場資料
        env:
          SCOPE: ${{ inputs.scope }}
        run: |
          if [ "$SCOPE" = "full" ]; then
            python run_ingestion.py
          else
            python run_ingestion.py --equity-only
          fi

      # 輸入指紋（CSV 層）：記錄本次匯入實際產出了什麼。
      #
      # **權威指紋在 b_segment_report.txt 裡**——那份是對「實際餵進回測的資料表」
      # 取的，與數字印在同一個檔案。本步驟涵蓋不到匯入失敗的標的（沒有 CSV 就
      # 沒有雜湊），而那正是最危險的情形，故兩者並存：CSV 層答「抓到了什麼」，
      # 報告層答「算的是什麼」。
      #
      # **沒有指紋，B 段的數字不可重現也無法稽核。**
      #
      # 實測發現（run 30705889130 vs 30706143694，同一 commit）：yfinance 對
      # 相同標的、相同期間、相同筆數會回傳**數值不同**的資料——`auto_adjust=True`
      # 的還原價取決於 Yahoo 當下回傳的股利/分割歷史，而那會浮動。後果是
      # walk-forward 對同一組參數、同一個訓練窗算出不同的 Calmar
      # （00878.TW Fold 1：1.82 / 2.10 / 1.82），00878 Fold 2 的交易數
      # 甚至從 3 變 4。五檔中 0050／00919／00631L 穩定，2330／00878 會飄。
      #
      # 程式碼本身是決定性的（optimizer 為固定清單網格搜尋、`>` 嚴格比較先到先贏，
      # optimizer.py 與 walk_forward.py 皆無 RNG 或平行化），所以差異只可能來自輸入。
      # 指紋讓「這批數字對應哪份資料」成為 artifact 的一部分：日後兩份報告對不起來時，
      # 先比指紋就能區分「策略改了」與「資料變了」。
      - name: 記錄輸入資料指紋
        run: |
          mkdir -p artifacts
          {
            echo "# B 段輸入資料指紋"
            echo "# run_id=${{ github.run_id }}  sha=${{ github.sha }}  utc=$(date -u +%FT%TZ)"
            echo "# 欄位：sha256  行數  檔案"
            for f in "data"/*.csv; do
              [ -e "$f" ] || continue
              printf '%s  %s  %s\n' \
                "$(sha256sum "$f" | cut -d' ' -f1)" \
                "$(wc -l < "$f")" \
                "$f"
            done
          } | tee artifacts/data_fingerprint.txt

      # tee 到檔案：終端輸出會隨 log 保留期限消失，artifact 才是可引用的產物。
      # 經 env 傳遞輸入而非插值進指令字串（沿用 alert_scheduler.yml 的既有慣例）。
      - name: 執行 B 段實測
        env:
          TICKER: ${{ inputs.ticker }}
          SIMS: ${{ inputs.sims }}
        run: |
          mkdir -p artifacts
          if [ -n "$TICKER" ]; then
            python run_b_segment.py "$TICKER" --sims "$SIMS" 2>&1 | tee artifacts/b_segment_report.txt
          else
            python run_b_segment.py --sims "$SIMS" 2>&1 | tee artifacts/b_segment_report.txt
          fi

      # 濾網累加階梯 + 買進持有對照。回答的是 B 段報告回答不了的那個問題：
      # **在這堆濾網之前，訊號本身有沒有東西？**
      #
      # 兩者都只加量測、不動訊號邏輯：
      # - 買進持有給每個絕對報酬一個機會成本對照（此前全專案沒有任何 benchmark）。
      # - 累加階梯由裸訊號逐層加回，讓「邊際在哪一層被殺掉」成為可讀的軌跡。
      #
      # continue-on-error：這是診斷用產出，失敗不該擋掉上游已經跑完的 B 段數字。
      # 現貨路徑（run_ablation 走 equity_instrument），期貨不在其範圍。
      - name: 執行濾網累加階梯與買進持有對照
        continue-on-error: true
        run: python run_ablation.py 2>&1 | tee artifacts/ablation_ladder_report.txt

      # Walk-Forward 是「是否改為預設啟用」的第二道門檻（單次回測對照不足）。
      # 它跑的是預設組態（三項皆關閉），故只作為樣本外穩定性的參考基線。
      - name: 執行 Walk-Forward 樣本外驗證
        continue-on-error: true
        run: python run_walk_forward.py 2>&1 | tee artifacts/walk_forward_report.txt

      # mkdir 不可省：建立 artifacts/ 的另外兩步（指紋、B 段實測）在匯入失敗時
      # 會被 skip，本步驟卻是 if: always()。run 31137879960 即如此——匯入紅掉後
      # `cp trendpoint.db artifacts/` 在目錄不存在下失敗，DB 沒進 artifact，
      # 而那正是最需要拿它來查為什麼失敗的時候。
      - name: 收集產物
        if: always()
        run: |
          mkdir -p artifacts
          cp -v trendpoint.db artifacts/ 2>/dev/null || echo "（無 trendpoint.db）"
          mkdir -p artifacts/data && cp -v data/*.csv artifacts/data/ 2>/dev/null || echo "（無 CSV 快取）"
          ls -la artifacts

      - name: 上傳報告與資料庫
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b-segment-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
