backtest:
  init_capital: 1000000.0
  # 期貨與現貨分開：大台一口名目值 = 指數 × 200，指數 25,000 時為 500 萬。
  # 以現貨的 100 萬資本，1× 槓桿連一口都下不起（實測 0 筆交易）——
  # 槓桿與資本被合約規格綁死，不能各自獨立設定。
  # 1,000 萬使 1× 在全歷史價位皆可交易。
  futures_init_capital: 10000000.0
data:
  database_path: trendpoint.db
  # spec 010：期貨真實資料源參數（TAIFEX 回填/節流/重試 + 交叉驗證容差）
  futures_source:
    backfill_start: "1998-07-21"
    throttle_seconds: 2.0
    max_retries: 3
    verify_tolerance: 0.0
  # 現貨日線取數期間。max：B 段實測顯示 10y 下各標的僅 6~14 筆交易，
  # 遠低於統計推論所需的 30 筆。代價是納入 1990 年代台股（市場結構不同）——
  # 樣本量與同質性的取捨，要縮短請改這裡，勿回頭在 adapter 硬編碼。
  equity_history_period: max
  tickers:
  - 2330.TW
  - 0050.TW
  - 00878.TW
  - 00919.TW
  - 00631L.TW
  # spec 008a：結構化 instrument（期貨）。source=mock 供端到端驗證，來源後補。
  # spec 008b：futures 必帶 contract（乘數/tick/交易所每口每邊定額費，TAIFEX 權威值）。
  instruments:
  - id: TXF
    asset_class: futures
    source: taifex          # spec 010：真源（TAIFEX 官方）——run_ingestion 回填/增量、監控讀庫+當日端點
    display_name: 臺股期貨
    timeframes:
    - daily
    contract:
      point_value: 200      # 大台每點 NT$200
      tick_size: 1
      exchange_fee_per_lot: 20     # 經手費 12 + 結算費 8（每口每邊）
  - id: MTX
    asset_class: futures
    source: mock
    display_name: 小型臺指近月（mock）
    timeframes:
    - daily
    contract:
      point_value: 50       # 小台每點 NT$50
      tick_size: 1
      exchange_fee_per_lot: 12.5   # 經手費 7.5 + 結算費 5（每口每邊）
data_quality:
  max_close_jump_ratio: 3.0
strategy:
  default:
    atr_period: 14
    chandelier_mult: 3.0
    chandelier_period: 22
    ladder_k: 2.0
    time_limit: 15
    use_fvg: true
    fvg_lookback: 3
    # spec 007：MSS fractal 反轉（ticker_overrides 亦可覆寫下列鍵）
    swing_fractal_n: 2
    mss_reversal_entry: true
    mss_ladder_k: null
    mss_volume_mult: 1.5
    # spec 003：期貨做空（預設關；僅期貨生效——現貨結構上無空方路徑）。
    # 對期貨標的啟用：於 ticker_overrides 對期貨 instrument id（如 TXF）設 enable_short: true
    # enable_short: false
    # spec 012：BOS 續勢進場的量能確認（**預設關閉**）。
    # 與 mss_volume_mult 獨立——後者是 MSS 位移確認，作用於反轉路徑，兩者不共用參數。
    # 回看期刻意不綁定 structure_period（結構樞紐的回看窗與「均量該取多長」
    # 無先驗關聯，理由見 specs/012-bos-volume-confirmation/research.md D4）。
    use_bos_volume: false
    bos_volume_mult: 1.5
    bos_volume_period: 20
    # spec 013：進場閘門（兩道皆預設關閉）。關閉時回測結果與本案實作前逐筆逐根一致。
    # dd_limit_pct / dd_resume_pct 的預設值**僅為形式佔位**——閘門關閉故不生效；
    # 實際採用值須由 SC-015 以 monte_carlo 的 p95 回撤分布校準後決定並記錄依據
    # （回撤門檻是最容易被後見之明挑選的參數）。
    use_dd_gate: false
    dd_limit_pct: 0.20
    dd_resume_pct: 0.10      # 必須嚴格小於 dd_limit_pct（遲滯區間，schema 強制）
    use_settlement_gate: false   # 僅期貨生效（每月第三個週三，遇假日順延）
  ticker_overrides:
    0050.TW:
      atr_period: 10
      chandelier_mult: 3.0
      chandelier_period: 22
      ladder_k: 1.5
      time_limit: 15
    00631L.TW:
      atr_period: 10
      chandelier_mult: 3.0
      chandelier_period: 22
      ladder_k: 1.5
      time_limit: 15
    00878.TW:
      atr_period: 10
      chandelier_mult: 3.0
      chandelier_period: 22
      ladder_k: 1.5
      time_limit: 15
    00919.TW:
      atr_period: 10
      chandelier_mult: 3.0
      chandelier_period: 22
      ladder_k: 1.5
      time_limit: 15
    2330.TW:
      atr_period: 10
      chandelier_mult: 3.0
      chandelier_period: 22
      ladder_k: 1.5
      time_limit: 15
# spec 014：均線觸價通知。這些是「通知偏好」而非策略參數——不進回測、不影響
# 任何訊號、不被 optimizer 掃描，故獨立於 strategy 區塊之外。
# 總開關預設關閉：新增的通知類型不應在使用者未要求時自行啟用。
# 週期為台股慣例的交易日根數（部分券商用 21/62/124/248，依偏好調整）。
alerts:
  ma_alerts_enabled: false
  monthly:
    enabled: true
    period: 20
  quarterly:
    enabled: true
    period: 60
  half_yearly:
    enabled: true
    period: 120
  yearly:
    enabled: true
    period: 240
trading_cost:
  commission_rate: 0.001425
  slip_rate: 0.0005
  tax_rate: 0.003
  # spec 008b：期貨帳戶/政策層費率（契約內生值在 data.instruments 的 contract）
  futures:
    broker_commission_per_lot: 0   # 券商加收每口每邊；0 = 僅 TAIFEX 權威費率（可填實際券商數字）
    tax_rate: 0.00002              # 期交稅/邊（十萬分之二，兩邊各收）
    slippage_ticks: 1              # 每邊滑價 tick 數（1 tick = 1 點）
    margin_rate: 0.055             # 每口保證金 = 名目值 × 此值（歷史約 4-6%）
    # 口數 = floor(權益 × 此值 ÷ 每口保證金)。
    #
    # ⚠ 這個參數的名稱會誤導：它**不是**「動用資金比例」。
    #   名目槓桿 = margin_utilization / margin_rate（與價位無關）。
    #   0.055 → 1×、0.11 → 2×、0.275 → 5×、0.5 → 9.09×。
    #
    # 現值 0.055 = **1 倍（無槓桿）**，作為研究基準：期貨路徑的回測數字因此
    # 只反映策略本身，且與現貨路徑同量級，兩邊的 spec 012/013 證據才可比。
    #
    # 前值為 0.5（9.09×），已於 P1 查證為 TXF 基準 -97.69% 的成因——
    # 指數反向 11% 即令權益歸零，且權益跌破一口保證金後策略靜默停止進場
    # （TXF@20,000 需 220,000/口），「28 年 7 筆交易」是帳戶沒錢了而非
    # 策略的進場頻率。在該設定下期貨結果主要描述槓桿，無法用於裁決訊號優劣。
    #
    # 槓桿是可事後另外疊加的決定；要提高請連同 MDD 一起看，並記得
    # blown_up 只在權益 ≤ 0 時觸發，抓不到慢性失血（改看報告的 margin_dead）。
    margin_utilization: 0.055
